[project]
name = "jobshield"
version = "0.1.0"
description = "JobShield - Verified Job Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "phonenumbers>=8.13.41",
    "openpyxl>=3.1.2",
    "pandas>=2.1.4",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "email-validator>=2.1.0",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.7",
    "aiofiles>=23.2.1",
    "orjson>=3.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=25.3.0",
    "ruff>=0.1.14",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]
ai = [
    "openai>=1.6.1",
    "anthropic>=0.8.1",
    "langchain>=0.1.0",
]
email = [
    "google-auth>=2.25.2",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    "google-api-python-client>=2.108.0",
    "msal>=1.25.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=68.2.2", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "COM", "DTZ", "EM", "EXE", "FA", "ISC", "ICN", "INP", "PIE", "PT", "Q", "RET", "RSE", "SIM", "T10", "T20", "TCH", "TRY", "TD", "PTH", "PYI", "PL", "RUF", "NPY"]
ignore = ["ANN101", "ANN102", "ANN103", "ARG001", "ARG002", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "INP001", "PIE797", "PLW3201", "TRY003", "TRY300", "TRY301", "RUF012", "RUF013"]
per-file-ignores = {
    "tests/*": ["S101", "S106", "S113", "SLF001"],
    "alembic/*": ["D100", "D101", "D102", "D103", "D104", "D105", "D107"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]